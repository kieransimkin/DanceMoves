<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DanceMoves reusable effects preview</title>
<style>
html,body{margin:0;min-height:100%;background:#111827;color:#f8fafc;font:16px/1.5 system-ui,sans-serif}.ks-epk{min-height:100vh;display:grid;place-items:center}.stage{position:relative;width:min(900px,calc(100vw - 32px));height:min(620px,calc(100vh - 32px));overflow:hidden;border:1px solid #ffffff26;border-radius:28px;background:radial-gradient(circle at 20% 15%,#7c3aed44,transparent 38%),linear-gradient(145deg,#1e293b,#0f172a);perspective:900px}.subject{position:absolute;left:50%;top:50%;width:180px;height:120px;margin:-60px -90px;border-radius:22px;background:linear-gradient(135deg,#f8fafc,#93c5fd);box-shadow:0 28px 70px #0008;transform:translate3d(calc(var(--dance-moves-x,0)*28px),calc(var(--dance-moves-y,0)*20px),0) rotateX(calc(var(--dance-moves-y,0)*-7deg)) rotateY(calc(var(--dance-moves-x,0)*9deg));transition:transform 120ms ease-out}.subject:after{content:"CSS owns this look";position:absolute;inset:auto 0 14px;text-align:center;color:#172554;font-weight:700}.ks-epk.is-preview-cue .subject{animation:cue-pop var(--dance-moves-16t,.5s) ease-out}.status{position:absolute;left:24px;bottom:20px;margin:0;color:#bfdbfe}.controls{position:absolute;right:24px;bottom:18px}.controls button{padding:.65rem .9rem;border:0;border-radius:999px;background:#fff;color:#111827;font-weight:700}@keyframes cue-pop{50%{scale:1.12;box-shadow:0 28px 90px #8b5cf699}}@media(prefers-reduced-motion:reduce){.subject{transition:none;transform:none!important}.ks-epk.is-preview-cue .subject{animation:none}}
</style></head><body>
<main class="ks-epk"><section class="stage"><div class="subject" aria-hidden="true"></div><p class="status" aria-live="polite">Move the pointer; the shared runtime supplies bounded coordinates.</p><div class="controls"><button type="button">Fire preview cue</button></div></section></main>
<script>window.danceMovesConfig={version:'2.7.0',pageId:0,bpm:120,bpmSource:'explicit',effect:''};</script>
<script src="../assets/dance-moves-core.js"></script><script src="../assets/dance-moves-effects.js"></script>
<script>(function(){var root=document.querySelector('.ks-epk');var status=document.querySelector('.status');DanceMovesEffects.pointer({id:'preview:pointer',root:root,bounds:'.stage'});DanceMovesEffects.cueClass({id:'preview:cue',root:root,cue:'PREVIEW',className:'is-preview-cue',durationTicks:16,render:function(event){status.textContent='Cue callback fired '+event.count+' time'+(event.count===1?'':'s')+'.';}});DanceMovesEffects.quality({id:'preview:quality',root:root,render:function(state){root.dataset.previewQuality=state.tier;}});document.querySelector('button').addEventListener('click',function(){DanceMoves.fireCue({name:'PREVIEW',type:'cue',time:0});});}());</script>
</body></html>
