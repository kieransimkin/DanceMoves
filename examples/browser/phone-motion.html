<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DanceMoves phone input composition</title><link rel="stylesheet" href="../../lib/dancemoves.css"><style>body{font:1rem system-ui;background:#17202b;color:white;padding:2rem}#stage{max-width:28rem;padding:5rem 2rem;border:1px solid;transform:perspective(900px) rotateX(calc(var(--dance-moves-y,0)*-3deg)) rotateY(calc(var(--dance-moves-x,0)*3deg))}button{min-height:44px}</style><main id="root"><h1>Shared pointer and phone input</h1><p>Tilt uses bounded input. Reduced motion and forced colours retain a static card.</p><div id="stage">Move a pointer, or enable phone motion on a supported secure phone.</div><button id="toggle" type="button">Pause motion</button></main><script type="module">import {createDanceMoves} from '../../lib/index.mjs';const root=document.querySelector('#root'),stage=document.querySelector('#stage');const runtime=createDanceMoves({root});await runtime.ready;runtime.effects.pointer({id:'demo:card',root:stage,bounds:stage});const input=runtime.connectPhoneMotion({pointers:['demo:card'],enabled:()=>root.dataset.motion!=='off',watchAttributes:['data-motion']});document.querySelector('#toggle').addEventListener('click',event=>{root.dataset.motion=root.dataset.motion==='off'?'on':'off';event.target.textContent=root.dataset.motion==='off'?'Resume motion':'Pause motion';});</script></html>
