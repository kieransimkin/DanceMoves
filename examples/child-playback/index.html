<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DanceMoves child watch page</title>
<style>*{box-sizing:border-box}body{font:18px system-ui;background:#111b25;color:#edf3f7;margin:0}main{max-width:900px;margin:auto;padding:2rem}a{color:#8ed9ff}button{font:inherit;padding:.7rem 1rem}#cover{width:min(100%,360px);aspect-ratio:1;background:#255168;border:2px solid #8ed9ff;display:grid;place-items:center}.is-playing #cover{opacity:calc(.6 + var(--child-pulse-opacity,.4))}dialog{padding:1rem;border:1px solid #8ed9ff;background:#152b39;color:white;width:min(900px,calc(100vw - 3rem));max-height:90vh}dialog::backdrop{background:#000b}iframe{width:100%;height:min(62vh,560px);border:0;margin-top:1rem}dialog header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}audio{width:100%}</style>
<main id="main"><h1>Parent EPK fixture</h1><div id="cover">Artwork remains on the main page</div><p><a id="open" href="watch.html">Watch video</a></p><audio id="master" controls preload="metadata" src="../playback-sources/media/master.wav"></audio><p id="lyrics" aria-live="polite"></p><p id="cues"></p><p id="status" role="status">Loading shared runtime…</p><button id="seek">Seek to master second 60</button><button id="destroy">Destroy runtime</button><pre id="state"></pre></main>
<dialog id="modal" aria-labelledby="modal-title"><header><h2 id="modal-title">Watch the synthetic excerpt</h2><button id="modal-seek">Jump to master second 60</button><button id="close" autofocus>Close video</button></header><div id="frame-slot"></div></dialog>
<script type="module">
import {createDanceMoves} from '../../lib/index.mjs';
const root=document.querySelector('main'),audio=document.querySelector('audio'),dialog=document.querySelector('dialog'),link=document.querySelector('#open'),slot=document.querySelector('#frame-slot'),status=document.querySelector('#status');
const motion=createDanceMoves({root,bpm:120,masterDurationMilliseconds:120000,lyricTimingUrl:'../playback-sources/media/lyrics.lrc',cueTimingUrl:'../playback-sources/media/sections.cue'});
await motion.ready;let bridge=null,scrollY=0;
const snapshot=()=>{document.querySelector('#state').textContent=JSON.stringify({version:motion.version,time:motion.destroyed?null:motion.playbackSource?.(audio).currentTime,paused:motion.destroyed?true:motion.playbackSource?.(audio).paused,bridge:bridge?.snapshot(),resources:motion.resources(),destroyed:motion.destroyed},null,2);};
motion.onLyric(detail=>{document.querySelector('#lyrics').textContent=detail.text;});motion.onCue('*',cue=>{document.querySelector('#cues').textContent=cue.name;});
motion.effects.playbackPulse({id:'child:parent-pulse',root,audio,ticks:32,className:'is-playing',propertyPrefix:'child-pulse',render:snapshot});
function close(){bridge?.teardown();bridge=null;slot.replaceChildren();if(dialog.open)dialog.close();document.documentElement.style.overflow='';window.scrollTo(0,scrollY);link.focus();snapshot();}
link.addEventListener('click',event=>{if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||event.button!==0)return;if(!motion.registerPlaybackProvider){status.textContent='Shared player API is required before this modal can be mounted.';return;}event.preventDefault();scrollY=window.scrollY;dialog.showModal();document.documentElement.style.overflow='hidden';const frame=document.createElement('iframe');frame.title='Synthetic excerpt watch page';frame.allow='fullscreen';frame.src=link.href;slot.append(frame);bridge=motion.receiveChildPlayback({iframe:frame,master:audio,masterVerified:true,offset:48,duration:20,origin:location.origin,channel:'watch-fixture',assetId:'original-synthetic-clip'});bridge.player.addEventListener('dismiss',close);bridge.ready.then(()=>{status.textContent='Child playback connected';snapshot();},()=>{status.textContent='Video connection unavailable. Open the watch page directly.';});snapshot();});
dialog.addEventListener('cancel',event=>{event.preventDefault();close();});document.querySelector('#close').addEventListener('click',close);
document.querySelector('#seek').addEventListener('click',()=>{motion.playbackSource(audio).currentTime=60;});
document.querySelector('#modal-seek').addEventListener('click',()=>{motion.playbackSource(audio).currentTime=60;});
document.querySelector('#destroy').addEventListener('click',()=>{close();motion.destroy();snapshot();});
status.textContent=motion.registerPlaybackProvider?'Ready to open the watch page':'Shared player API required';snapshot();
</script></html>
