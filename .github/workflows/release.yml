name: Publish shared DanceMoves release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH or prerelease tag
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'kieransimkin/DanceMoves'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      REQUIRE_LOCK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
      - name: Verify exact immutable tag checkout
        id: source
        shell: bash
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG_NAME^{commit}")"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: node tools/install-ci.mjs
      - run: npm run check:release
      - run: npm run build
      - run: npm test
      - run: python tests/shared/test_package_outputs.py
      - run: npm run test:legacy
      - uses: WordPress/plugin-check-action@005058d6dbd2942b6a58610836b981c2ee3cc19d
        with:
          build-dir: .build/wordpress
          categories: plugin_repo
          slug: dancemoves
          wp-version: '7.1.3'
      - run: npm run demo:prepare
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/shared/orientation-navigation-browser.mjs
      - run: node tests/shared/control-feedback-browser.mjs
      - run: npm run test:next
      - run: npm run test:next:smoke
      - run: node tools/prepare-release.mjs
      - run: node tools/verify-release-output.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG_NAME }}
          path: release-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-evidence-${{ env.TAG_NAME }}
          path: .build/browser-evidence/
          if-no-files-found: ignore
  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: OIDC-capable npm (no package install scripts)
        run: npm install --global npm@11.6.0 --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.TAG_NAME }}
          path: release-output/
      - run: node tools/verify-release-output.mjs
      - run: node tools/publish-npm.mjs
  github:
    needs: [build, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.TAG_NAME }}
          path: release-output/
      - run: node tools/verify-release-output.mjs
      - run: node tools/publish-github.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  wordpress-org:
    needs: [build, github]
    if: vars.WPORG_PLUGIN_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment: wordpress-org
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      WPORG_SLUG: ${{ vars.WPORG_PLUGIN_SLUG }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.TAG_NAME }}
          path: release-output/
      - name: Stage the exact tested package for its approved directory slug
        id: directory
        shell: bash
        run: |
          [[ "$WPORG_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || exit 1
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          node tools/verify-release-output.mjs
          python -c "import os,pathlib,zipfile; v=os.environ['TAG_NAME'][1:]; p=pathlib.Path('release-output')/('DanceMoves-wordpress-'+v+'.zip'); zipfile.ZipFile(p).extractall('wordpress-build')"
          test -f wordpress-build/kieran-epk-device-orientation/readme.txt
      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: ${{ env.WPORG_SLUG }}
          VERSION: ${{ steps.directory.outputs.version }}
          BUILD_DIR: wordpress-build/kieran-epk-device-orientation
